<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="meterGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Meter Track (Background Arc) -->
  <path d="M 32 82 A 38 38 0 1 1 96 82" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />

  <!-- Meter Active Arc -->
  <path d="M 32 82 A 38 38 0 1 1 88 52" fill="none" stroke="url(#meterGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Hub -->
  <circle cx="64" cy="68" r="8" fill="#f8fafc" />
  <circle cx="64" cy="68" r="4" fill="#0284c7" />

  <!-- Pointer Needle -->
  <line x1="64" y1="68" x2="80" y2="46" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- Digital Activity Dots -->
  <circle cx="48" cy="94" r="3" fill="#06b6d4" />
  <circle cx="64" cy="94" r="3" fill="#3b82f6" />
  <circle cx="80" cy="94" r="3" fill="#10b981" />
</svg>
