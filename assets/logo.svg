<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Background Meter Ring (Symmetrical opening at bottom) -->
  <circle cx="64" cy="62" r="42" stroke="#1E293B" stroke-width="6" stroke-dasharray="198 264" stroke-linecap="round" fill="none" transform="rotate(135 64 62)" />

  <!-- Active Meter Ring (~70% filled representing 256k window capacity) -->
  <circle cx="64" cy="62" r="42" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="142 264" stroke-linecap="round" fill="none" transform="rotate(135 64 62)" />

  <!-- Context Waveform Trend (Heartbeat / Growth & Compression Curve) -->
  <path d="M 36 64 L 47 64 L 54 48 L 62 72 L 72 44 L 81 56 L 92 56" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Key Peak Node (Active Context Focus) -->
  <circle cx="72" cy="44" r="3.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5" />

  <!-- Activity Indicator Nodes (Clean, centered at bottom) -->
  <circle cx="52" cy="94" r="2.5" fill="#38BDF8" />
  <circle cx="64" cy="94" r="2.5" fill="#818CF8" />
  <circle cx="76" cy="94" r="2.5" fill="#34D399" />
</svg>
